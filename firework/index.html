<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Firework</title>
<style>html,body{margin:0;min-height:100%;background:#090909}#oc-text-firework{min-height:100vh;display:flex;flex-direction:column;justify-content:center}</style>
</head>
<body>
<div id="oc-text-firework">
  <style>
    #oc-text-firework { background:#090909;color:#f4f4ef;padding:24px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    #oc-text-firework * { box-sizing:border-box; }
    #oc-text-firework .oc-stage {position:relative;margin:14px 0;overflow:hidden;}
    #oc-text-firework pre {font:400 clamp(6px,1.65vw,12px)/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0;margin:0;white-space:pre;background:none;border:0;padding:0;text-align:center;color:inherit;}
    #oc-text-firework .oc-field {position:absolute;inset:0;color:#292929;pointer-events:none;user-select:none;}
    #oc-text-firework .oc-art {position:relative;user-select:text;}
    #oc-text-firework .oc-controls {display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:11px;color:#b5b5af;}
    #oc-text-firework button {font:inherit;color:#f4f4ef;background:transparent;border:1px solid #555;padding:10px 14px;min-height:44px;}
    #oc-text-firework input {accent-color:#eee;flex:1;min-width:100px;}
    #oc-text-firework .oc-status {min-width:105px;}
  </style>
  <div class="oc-stage">
    <pre class="oc-field" aria-hidden="true"></pre>
    <pre class="oc-art" aria-label="Selectable ASCII firework: delicate uneven trails expand from an open circular center."></pre>
  </div>
  <div class="oc-controls">
    <button class="cursor-interaction oc-replay" type="button">Replay burst</button>
    <label for="oc-time">Frame</label><input id="oc-time" aria-label="Firework animation time" type="range" min="0" max="1600" value="680" step="1">
    <span class="oc-status" aria-live="polite">680 ms / bloom</span>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('oc-text-firework');
    const art=root.querySelector('.oc-art'),field=root.querySelector('.oc-field'),slider=root.querySelector('input'),status=root.querySelector('.oc-status'),button=root.querySelector('button');
    const W=95,H=43,cx=47,cy=18;
    let seed=4217;
    function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
    const rays=Array.from({length:34},(_,i)=>({a:i/34*Math.PI*2+(rand()-.5)*.1,len:29+rand()*17,bend:(rand()-.5)*2,n:7+Math.floor(rand()*4),offset:rand(),life:.85+rand()*.4}));
    field.textContent='';
    function fit(){const size=Math.min(12,(root.querySelector('.oc-stage').clientWidth-2)/(W*.603));art.style.fontSize=size+'px';}
    new ResizeObserver(fit).observe(root.querySelector('.oc-stage'));
    fit();
    function draw(t){
      const g=Array.from({length:H},()=>Array(W).fill(' '));
      const priority={'.':1,':':2,'-':3,'/':3,'\\':3,'|':3,'+':4,'*':5};
      const put=(x,y,ch)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<W&&y>=0&&y<H&&(priority[ch]||0)>(priority[g[y][x]]||0))g[y][x]=ch;};
      if(t<80){
        const r=2.3*(1-t/100);
        for(let i=0;i<8;i++){const a=i*Math.PI/4;put(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.44,'.');}
        put(cx,cy,t>55?'*':'.');
      }else if(t<1600){
        const tau=(t-80)/760;
        rays.forEach((ray,ri)=>{
          if(tau>ray.life+0.62)return;
          const point=(u)=>{const travel=ray.len*(1-Math.exp(-2.05*u));return [cx+Math.cos(ray.a)*travel+ray.bend*u*u,cy+Math.sin(ray.a)*travel*.44+4.5*u*u];};
          for(let j=0;j<ray.n;j++){
            const age=j/(ray.n-1),u=tau-age*Math.min(.47,tau*.7);
            if(u<.02)continue;
            if(tau>1.05 && ((ri*7+j*3)%13)/13<(tau-1.05)/.85)continue;
            const [x,y]=point(u);
            let ch=age<.1?(ri%3===0?'*':'+'):age<.27?'+':age<.48?':':'.';
            if(age>.25&&age<.65&&ri%3!==0){
              const [px,py]=point(Math.max(0,u-.02));
              const slope=(y-py)/(x-px);
              ch=Math.abs(slope)<.22?'-':Math.abs(slope)>1.4?'|':slope>0?'\\':'/';
            }
            if(tau>1.1)ch=age<.15?'+':'.';
            put(x,y,ch);
          }
          if(tau>.5&&ri%3===0){const [x,y]=point(Math.max(.1,tau-.18));put(x+2*ray.offset-1,y+1.5+tau*ray.offset,'.');}
        });
        if(tau<.38){for(let i=0;i<8;i++){const a=i*Math.PI/4;put(cx+Math.cos(a)*2,cy+Math.sin(a),'.');}}
      }
      art.textContent=g.map(r=>r.join('')).join('\n');
      slider.value=t;
      status.textContent=Math.round(t)+' ms / '+(t<80?'compress':t<350?'burst':t<900?'bloom':'fall');
    }
    let animation=0;
    slider.addEventListener('input',()=>{cancelAnimationFrame(animation);draw(Number(slider.value));});
    button.addEventListener('click',()=>{
      cancelAnimationFrame(animation);
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw(680);return;}
      const start=performance.now();
      function frame(now){const t=Math.min(1600,now-start);draw(t);if(t<1600)animation=requestAnimationFrame(frame);}
      animation=requestAnimationFrame(frame);
    });
    draw(680);
  })();
  </script>
</div>

</body>
</html>
